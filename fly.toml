# fly.toml app configuration file generated for fmg-daily-brief on 2026-03-10T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "fmg-daily-brief"
primary_region = "lax"

[build]
  builder = "heroku"

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  processes = ["app"]

  [services.http_checks]
    enabled = true
    grace_period = "5s"
    interval = "30s"
    method = "get"
    min_interval = "30s"
    path = "/health"
    protocol = "http"
    timeout = "5s"
    tls_skip_verify = false

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "5s"
    interval = "30s"
    timeout = "5s"
